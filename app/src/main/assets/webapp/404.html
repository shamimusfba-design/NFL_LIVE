<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEMO LIVE — Production & Quality ERP</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <script>
      (function () {
        try {
          var pathname = window.location.pathname || '/';
          var isDemoPath = /\/(demo|client-demo|showcase)(\/.*)?$/i.test(pathname);
          var currentParams = new URLSearchParams(window.location.search);
          if (isDemoPath) {
            currentParams.set('demo', 'client');
          }
          var repoMatch = pathname.match(/^(\/[^/]+\/)/i);
          var basePath = repoMatch ? repoMatch[1] : '/';
          var query = currentParams.toString();
          var target = window.location.origin + basePath + (query ? '?' + query : '') + (window.location.hash || '');
          window.location.replace(target);
        } catch (e) {
          window.location.href = '/?demo=client';
        }
      })();
    </script>
  </head>
  <body style="margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="text-align:center;padding:24px;">
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;">Redirecting to DEMO LIVE...</div>
      <a href="/?demo=client" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:700;font-size:13px;">Open DEMO LIVE</a>
    </div>
  </body>
</html>
