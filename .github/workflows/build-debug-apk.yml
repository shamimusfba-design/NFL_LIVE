name: Build NOS Live Debug APK & Web Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'web-dashboard-and-mobile/**'
      - 'firestore.rules'
      - '.github/workflows/build-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create local debug signing key required by project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk NOS-Live-app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOS-Live-app-debug
          path: NOS-Live-app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js 20 for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-dashboard-and-mobile/package-lock.json

      - name: Install and build Firebase-connected Web Dashboard
        working-directory: web-dashboard-and-mobile
        run: |
          npm ci
          npm run build

      - name: Upload Web Dashboard production bundle
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Live-Web-Dashboard-dist
          path: web-dashboard-and-mobile/dist
          if-no-files-found: error
          retention-days: 30

      - name: Deploy Web Dashboard to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_NFL_LIVE_72213 != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NFL_LIVE_72213 }}
          projectId: nfl-live-72213
          channelId: live

      - name: Warn when Firebase Hosting deployment credentials are missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_NFL_LIVE_72213 == ''
        run: echo "::warning::Web dashboard was built and archived, but Firebase Hosting deployment was skipped because FIREBASE_SERVICE_ACCOUNT_NFL_LIVE_72213 is not configured."

      # Tests run LAST so a failing test can never stop the installable APK from being built and uploaded above.
      # A failing test still turns this run red, so it stays visible.
      - name: Run Android unit & RBAC regression tests
        run: gradle --no-daemon :app:testDebugUnitTest
