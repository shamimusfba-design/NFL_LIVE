name: Build NOS Live Debug APK & Web Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'web-dashboard-and-mobile/**'
      - 'firestore.rules'
      - '.github/workflows/build-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the run publish a short diagnostics file to the ci-logs branch

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create local debug signing key required by project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk NOS-Live-app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOS-Live-app-debug
          path: NOS-Live-app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js 20 for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-dashboard-and-mobile/package-lock.json

      - name: Install and build Firebase-connected Web Dashboard
        working-directory: web-dashboard-and-mobile
        run: |
          npm ci
          npm run build

      - name: Upload Web Dashboard production bundle
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Live-Web-Dashboard-dist
          path: web-dashboard-and-mobile/dist
          if-no-files-found: error
          retention-days: 30

      # Tests run LAST so a failing test can never stop the installable APK from being built and uploaded above.
      # A failing test still turns this run red, so it stays visible.
      - name: Run Android unit & RBAC regression tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      # Always runs: writes the compile errors and failing tests to the ci-logs branch so they can be read without the Actions log viewer.
      - name: Publish diagnostics to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/diag
          {
            echo "run #$GITHUB_RUN_NUMBER  branch $GITHUB_REF_NAME  commit $GITHUB_SHA"
            echo
            echo "=== compile / build errors (build.log) ==="
            if [ -f build.log ]; then grep -hE '^e: |^w: .*(deprecat)|error:|FAILURE: Build failed|What went wrong|Execution failed' -A4 build.log | head -220; fi
            echo
            echo "=== last 40 lines of build.log ==="
            [ -f build.log ] && tail -40 build.log
            echo
            echo "=== failing unit tests ==="
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = bad = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              n += int(r.get('tests', 0))
              for tc in r.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for x in tc.findall(kind):
                          bad += 1
                          print('FAILED', tc.get('classname'), '::', tc.get('name'))
                          print('   ', (x.get('message') or '')[:400].replace('\n', ' '))
          print('tests run:', n, ' failed:', bad)
          PY
            echo
            echo "=== last 25 lines of test.log ==="
            [ -f test.log ] && tail -25 test.log
          } > /tmp/diag/latest.txt 2>&1 || true
          cd /tmp/diag
          git init -q -b ci-logs
          git config user.name "ci-diagnostics"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "diagnostics for run $GITHUB_RUN_NUMBER on $GITHUB_REF_NAME"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs || true
