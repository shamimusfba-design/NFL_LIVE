name: Deploy NFL LIVE Web App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-dashboard-and-mobile/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-live-github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-dashboard-and-mobile/package-lock.json

      - name: Install dependencies and build the shared web app
        working-directory: web-dashboard-and-mobile
        env:
          NODE_ENV: production
        run: |
          npm ci
          npm run build

      - name: Publish build output to the GitHub Pages docs folder
        run: |
          rm -rf docs/assets
          mkdir -p docs/assets
          cp -R web-dashboard-and-mobile/dist/. docs/
          for f in docs/assets/index-*.js; do
            if [ "$f" != "docs/assets/index-BQeQ-8tU.js" ]; then
              cp "$f" docs/assets/index-BQeQ-8tU.js
            fi
          done
          touch docs/.nojekyll

      - name: Commit updated live website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "GitHub Pages output is already up to date."
          else
            git commit -m "Deploy NFL LIVE web app to GitHub Pages"
            git push origin HEAD:main
          fi
