name: Build NFL LIVE app (opens the web version)

on:
  push:
    branches: [web-apk]
    paths:
      - 'web-app/**'
      - '.github/workflows/build-web-app.yml'
  workflow_dispatch:

permissions:
  contents: write   # to put the APK on the download page and write a short log on failure

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build the APK
        working-directory: web-app
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Name the file
        run: cp web-app/app/build/outputs/apk/release/app-release.apk NFL-LIVE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NFL-LIVE-apk
          path: NFL-LIVE.apk

      - name: Put the APK on the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nfl-live-app
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "NFL LIVE app (APK)" \
              --notes "Install on phone or Android TV. The app opens the live NFL LIVE web version, so updates arrive by themselves."
          fi
          gh release upload "$TAG" NFL-LIVE.apk --clobber

      - name: Keep a short log when the build fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          { echo "web app build, commit $GITHUB_SHA"; tail -150 "$GITHUB_WORKSPACE/web-app/build.log" 2>/dev/null || echo "no build.log"; } > webapp.txt
          git add webapp.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "web app build log" || true
          git push -q origin HEAD:ci-logs
