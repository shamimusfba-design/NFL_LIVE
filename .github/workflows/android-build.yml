name: Android Debug Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/admin-web-security-foundation
      - feature/quality-dashboard-line-deep-dive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create local debug signing key required by project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Set up Node.js 20 for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-dashboard-and-mobile/package-lock.json
      - name: Build Firebase-connected Web Dashboard
        working-directory: web-dashboard-and-mobile
        run: |
          npm ci
          npm run build
